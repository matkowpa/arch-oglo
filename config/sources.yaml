# Źródła danych (sekcje 2, 4–7 final_plan.md).

email:
  # ŹRÓDŁO 1 WYŁĄCZONE: platformazakupowa.pl NIE oferuje subskrypcji powiadomień
  # po kodach CPV (potwierdzone empirycznie 2026-08-28). Kod parsera zostaje
  # (dormant) na wypadek powiadomień z innych platform w Fazie 2.
  enabled: false
  # Sekrety wyłącznie z env / GitHub Secrets — nigdy w plikach.
  host: imap.gmail.com
  port: 993
  user_env: GMAIL_USER
  password_env: GMAIL_APP_PASSWORD
  mailbox: INBOX
  sender_contains: platformazakupowa.pl
  # Sekcja 4.5: subskrybować szeroko całą grupę 71* (nadmiar odfiltruje scoring).
  max_messages: 50

platformazakupowa_search:
  # Źródło 1 (nowe): publiczna wyszukiwarka /all — dostęp anonimowy (krok 0.5 OK).
  # robots.txt: Crawl-delay 900 -> JEDNO żądanie na run; frazy rotują wg dnia,
  # a workflow pz_search.yml uruchamia po jednym żądaniu na godzinę.
  base_url: https://platformazakupowa.pl/all
  limit: 30   # bez znaczenia — platforma zwraca wszystkie aktywne trafienia (weryfikacja limit=100: identyczne wyniki)
  phrases:
    - "dokumentacja wielobranżowa"
    - "prace projektowe"
    - "dokumentacja projektowa"
    - "dokumentacja projektowo-kosztorysowa"
    - "projektowanie architektoniczne"
    - "wielobranżowa"

ted:
  url: https://api.ted.europa.eu/v3/notices/search
  scope: ACTIVE
  limit: 100
  # 2026-08-30: TED indeksuje termin ofert w DWOCH polach (eForms: `deadline`,
  # legacy UBL z platform krajowych: `deadline-receipt-request`) — pola
  # ROZŁĄCZNE; only_open => OR obu. pages=5 pokrywa ~440 aktywnych ogłoszeń
  # (sonda 2026-08-30: 438).
  pages: 5
  crawl_delay: 5
  # Potwierdzone sondą 2026-08-28: filtr deadline>dziś zwraca TYLKO otwarte
  # postępowania i pole deadline jest wtedy wypełnione (bez niego TED zwracał
  # ogłoszenia zamknięte z pustym terminem).
  only_open: true
  # Krok 0: zapytanie budowane stopniowo — zacząć od prostego FT~.
  query: >
    classification-cpv IN (71200000 71220000 71221000 71222000 71240000
    71300000 71320000 71400000 71248000) AND buyer-country=POL

bzp:
  # Sekcja 6 / krok 0.2 — ROZSTRZYGNIĘTY empirycznie 2026-08-29
  # (szczegóły: docs/zrodla-decyzje.md). Endpoint anonimowy; NoticeType
  # jedyne potwierdzone wartości: ContractNotice; API ignoruje filtr CPV —
  # ogłoszenia filtrujemy lokalnie wg config/cpv.yaml (wolumen ~300–500/dzień).
  url: https://ezamowienia.gov.pl/mo-board/api/v1/notice
  notice_type: ContractNotice
  # Semantyka API (docs/zrodla-decyzje.md): PublicationDateTo wymagane, ale
  # IGNOROWANE; brak paginacji; DESC po dacie; PageSize <= 500. Pokrycie okna
  # przez przewijanie From na najstarsza publikacje w paczce (max_requests
  # ogranicza liczbe zapytan; duplikaty miedzy paczkami usuwa dedup).
  page_size: 500
  max_requests: 6
  days_back: 1
  enabled: true

bip:
  # Sekcja 7: pilotaż 4–5 spółek (sekcja 11, pyt. 1 — rozstrzygnięte).
  # Każda spółka = osobny parser (id -> klasa w scraper/run.py). Przed parserem
  # sprawdzić robots.txt i Crawl-delay. enabled: false = parser gotowy, ale
  # niepobierany (obserwacja przed włączeniem).
  companies:
    - id: phn
      name: Polski Holding Nieruchomości S.A.
      kind: sp
      enabled: true
      # strona /ogloszenia zwraca 404 — paginacja to /ogloszenia/1, /2, /3...
      list_url: https://bip.phnsa.pl/ogloszenia/1
      crawl_delay: 10
      pages: 3   # pobieraj strony 1..3 (przerwa crawl_delay między żądaniami)
    - id: tauron
      name: Grupa TAURON (SWOZ — Platforma Zakupowa)
      kind: sp
      enabled: true
      # UWAGA: www.tauron.pl/tauron/przetargi jest martwe (1 archiwalny wpis
      # z 2017, docs/zrodla-decyzje.md) — ogłoszenia grupy publikuje SWOZ
      # (swoz.tauron.pl, platforma Mercus). Server-side HTML, robots.txt: brak.
      list_url: https://swoz.tauron.pl/platform/demand/notice/public/current/list
      crawl_delay: 10
      # Paginacja formularzowa (POST) — MVP: strona 1 (~30 najnowszych)
    - id: kghm
      name: KGHM Polska Miedź S.A.
      kind: sp
      enabled: true
      # Właściwy spis to /pl/przetargi-nieograniczone (plan zgłaszał 404-owe
      # URL-e; odkrycie 2026-08-29, docs/zrodla-decyzje.md). Drupal views,
      # server-side, 10 wierszy/stronę, paginacja ?page=0..N (parser 1-based).
      list_url: https://kghm.com/pl/przetargi-nieograniczone
      crawl_delay: 10
      pages: 2   # 2 x 10 najnowszych; można zwiększyć po obserwacji wolumenu
      # PGG — listy zakupowe renderowane w JS (app-rB_Ysula.js, pusty <main>);
      # do powrotu dopiero po znalezieniu endpointu JSON (docs/zrodla-decyzje.md)
      # KGHM/PGE/PGG/ARP/Enea — do potwierdzenia sondą z runnera
      # (.github/workflows/bip_probe.yml), potem dodać wpisy.

sp_companies:  # rozpoznanie zamawiającego → bonus +1
  - "Polski Holding Nieruchomości"
  - "KGHM"
  - "PGE"
  - "Polska Grupa Górnicza"
  - "Agencja Rozwoju Przemysłu"
  - "ORLEN"
  - "Tauron"

exchange_companies:  # bonus +1 — spółki giełdowe
  - "ORLEN"
  - "KGHM"
  - "Tauron"
  - "PGE"

history_days: 90
display_days: 30
