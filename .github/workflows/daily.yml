name: daily-scrape

on:
  schedule:
    - cron: '7 5 * * *'    # nieokrągła minuta; harmonogram NIE jest gwarantowany (opóźnienia 5–30 min, run może zostać pominięty)
    - cron: '30 12 * * *'  # slot zapasowy — gdy 05:07 zostanie pominięte przez GitHuba (observed 2026-08-30)
  workflow_dispatch: {}   # ręczne uruchomienie do testów / po pominiętym runie

concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # pełna historia — wymagane dla git pull --rebase + push w kroku commit

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scraper
        run: python -m scraper.run

      - name: Commit data (heartbeat — always)
        run: |
          git config user.name "arch-oglo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "daily run: update announcements and site"
          fi
          # Pull+push w pętli retry: checkout potrafi złapać STARY ref (replica lag
          # po pushu poprzedniego runa w grupie data-write — observed 2026-08-31,
          # pz-search #16), wtedy rebase daje add/add conflict na heartbeat
          # data/history/<dzień>.json. -X theirs: wygrywa świeży scraping bieżącego
          # runu (w rebase "theirs" = replayowany lokalny commit). Po 3 próbach jawny
          # fail — bez tego pętla push po cichu "udawała" sukces (sleep 5 zwraca 0).
          ok=0
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              ok=1
              break
            fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Push failed after 3x (git pull --rebase -X theirs + git push)"
            exit 1
          fi

      - name: Upload site artifact (for deploy job)
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs_site
          retention-days: 1

  deploy-pages:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: docs_site
      # UWAGA: bez enablement:true — Pages jest już włączone; wywołanie enablement
      # potrafi zawisnąć na API (2026-08-31). Configure tylko odczytuje konfigurację.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs_site
      - id: deployment
        uses: actions/deploy-pages@v4
