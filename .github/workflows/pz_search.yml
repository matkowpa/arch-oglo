name: pz-search

# Źródło 1: publiczna wyszukiwarka platformazakupowa.pl — jedno żądanie na run.
# robots.txt: Crawl-delay 900 s, więc każda fraza dostaje OSOBNĄ godzinę:
# żądania nigdy nie są bliżej siebie niż 60 minut (zapas > 15 min).
# Frazy w config/sources.yaml (platformazakupowa_search.phrases).

# Zgodnie z decyzją właściciela repo (2026-08-28) harmonogram REAKTYWOWANY,
# mimo że Regulamin platformy zakazuje zautomatyzowanego pobierania (patrz README).
# Profil obciążenia: 1 żądanie/frazę/dzień, min. 60 min odstępu (Crawl-delay 900 = 15 min).
on:
  schedule:
    - cron: '7 5 * * *'   # fraza 1 (dokumentacja wielobranżowa)
    - cron: '7 6 * * *'   # fraza 2 (prace projektowe)
    - cron: '7 7 * * *'   # fraza 3 (dokumentacja projektowa)
    - cron: '7 8 * * *'   # fraza 4 (dokumentacja projektowo-kosztorysowa)
    - cron: '7 9 * * *'   # fraza 5 (projektowanie architektoniczne)
    - cron: '7 10 * * *'  # fraza 6 (wielobranżowa)
  workflow_dispatch:
    inputs:
      phrase:
        description: 'Fraza wyszukiwania (pusta = rotacja wg dnia)'
        required: false
        default: ''

concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # pełna historia — wymagane dla git pull --rebase + push
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Pick phrase for this run
        id: phrase
        run: |
          # Frazy z config/sources.yaml (platformazakupowa_search.phrases) —
          # rotacja wg godziny (05:07-10:07 UTC, patrz cron wyżej).
          PHRASE=$(python -c "import yaml,datetime;ps=yaml.safe_load(open('config/sources.yaml',encoding='utf-8'))['platformazakupowa_search']['phrases'];print(ps[(datetime.datetime.utcnow().hour-5)%len(ps)])")
          echo "phrase=$PHRASE" >> "$GITHUB_OUTPUT"

      - name: Run scraper (single search request)
        env:
          PZ_PHRASE: ${{ github.event.inputs.phrase || steps.phrase.outputs.phrase }}
        run: python -m scraper.run

      - name: Commit data (heartbeat — always)
        run: |
          git config user.name "arch-oglo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "pz-search run: update announcements"
          fi
          # Pull+push w pętli retry: checkout potrafi złapać STARY ref (replica lag
          # po pushu poprzedniego runa w grupie data-write — observed 2026-08-31,
          # pz-search #16), wtedy rebase daje add/add conflict na heartbeat
          # data/history/<dzień>.json. -X theirs: wygrywa świeży scraping bieżącego
          # runu (w rebase "theirs" = replayowany lokalny commit). Po 3 próbach jawny
          # fail — bez tego pętla push po cichu "udawała" sukces (sleep 5 zwraca 0).
          ok=0
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              ok=1
              break
            fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Push failed after 3x (git pull --rebase -X theirs + git push)"
            exit 1
          fi

      - name: Upload site artifact (for deploy job)
        uses: actions/upload-artifact@v4
        with:
          name: docs-site-pz
          path: docs_site
          retention-days: 1
          if-no-files-found: ignore   # docs_site może nie powstać, gdy scraper nic nie zmienił

  deploy-pages:
    needs: scrape
    runs-on: ubuntu-latest
    if: always() && needs.scrape.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-site-pz
          path: docs_site
      # Bez enablement:true — jak w daily.yml (zawieszenie na API, 2026-08-31)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs_site
      - id: deployment
        uses: actions/deploy-pages@v4
